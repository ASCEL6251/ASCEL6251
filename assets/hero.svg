<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Ascelstack — Build, grow and run your business on one stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1823"/>
      <stop offset="0.55" stop-color="#1D2D3D"/>
      <stop offset="1" stop-color="#253C52"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#94BCE3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#94BCE3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C9DFF4"/><stop offset="1" stop-color="#94BCE3"/></linearGradient>
    <linearGradient id="topB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#94BCE3"/><stop offset="1" stop-color="#5980A6"/></linearGradient>
    <linearGradient id="topC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6F96BC"/><stop offset="1" stop-color="#3E5F80"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94BCE3" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="clipTitle"><rect x="70" y="120" width="560" height="90"/></clipPath>
    <style>
      .sans{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
      .mono{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
      @keyframes floatS{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
      @keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-260px);opacity:0}}
      @keyframes spin{to{stroke-dashoffset:-400}}
      @keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.8;transform:scale(1.08)}}
      @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
      @keyframes sweep{0%{transform:translateX(-700px)}60%,100%{transform:translateX(700px)}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes tag{0%,100%{opacity:.55}50%{opacity:1}}
      .l1{animation:float 5s ease-in-out infinite}
      .l2{animation:float 5s ease-in-out .35s infinite}
      .l3{animation:float 5s ease-in-out .7s infinite}
      .glow{animation:pulse 5s ease-in-out infinite;transform-origin:900px 360px;transform-box:view-box}
      .orbit{stroke-dasharray:6 14;animation:spin 14s linear infinite}
      .orbit2{stroke-dasharray:2 10;animation:spin 22s linear infinite reverse}
      .p{animation:rise 7s linear infinite}
      .f1{animation:fadeUp .9s ease-out both}
      .f2{animation:fadeUp .9s ease-out .25s both}
      .f3{animation:fadeUp .9s ease-out .5s both}
      .f4{animation:fadeUp .9s ease-out .75s both}
      .sw{animation:sweep 6s ease-in-out 1.2s infinite}
      .cur{animation:blink 1s steps(1) infinite}
      .tg{animation:tag 3s ease-in-out infinite}
      .chip{animation:floatS 4s ease-in-out infinite}
    </style>
  </defs>

  <rect width="1200" height="440" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="22" fill="url(#grid)"/>

  <!-- rising particles -->
  <g fill="#94BCE3">
    <circle class="p" cx="700" cy="452" r="2" style="animation-delay:0s"/>
    <circle class="p" cx="760" cy="452" r="1.5" style="animation-delay:1.2s"/>
    <circle class="p" cx="820" cy="452" r="2.5" style="animation-delay:2.6s"/>
    <circle class="p" cx="980" cy="452" r="2" style="animation-delay:.6s"/>
    <circle class="p" cx="1040" cy="452" r="1.5" style="animation-delay:3.4s"/>
    <circle class="p" cx="1110" cy="452" r="2" style="animation-delay:4.8s"/>
    <circle class="p" cx="880" cy="452" r="1.2" style="animation-delay:5.5s"/>
    <circle class="p" cx="1150" cy="452" r="1.8" style="animation-delay:2s"/>
    <circle class="p" cx="640" cy="452" r="1.4" style="animation-delay:4s"/>
  </g>

  <!-- left copy -->
  <g class="sans">
    <g class="f1">
      <rect x="70" y="70" width="210" height="30" rx="15" fill="#94BCE3" fill-opacity="0.12" stroke="#94BCE3" stroke-opacity="0.35"/>
      <circle cx="90" cy="85" r="4" fill="#7EE2A8" class="tg"/>
      <text x="104" y="90" font-size="13" fill="#C9DFF4" letter-spacing="1.5" class="mono">ONE TEAM · ONE STACK</text>
    </g>
    <g class="f2" clip-path="url(#clipTitle)">
      <text x="70" y="190" font-size="76" font-weight="800" fill="#F2F2F3" letter-spacing="-1.5">Ascelstack</text>
      <rect class="sw" x="70" y="120" width="140" height="90" fill="url(#shine)" opacity="0.35"/>
    </g>
    <text class="f3" x="72" y="240" font-size="24" fill="#C9DFF4" font-weight="500">Build, grow and run your business on one stack.</text>
    <text class="f3" x="72" y="272" font-size="16" fill="#94BCE3" fill-opacity="0.85">Software · Marketing · Operations · AI Automation · Compliance</text>

    <g class="f4 mono" font-size="14">
      <rect x="70" y="310" width="430" height="44" rx="10" fill="#0E1823" fill-opacity="0.7" stroke="#5980A6" stroke-opacity="0.5"/>
      <text x="88" y="338" fill="#5980A6">$</text>
      <text x="106" y="338" fill="#F2F2F3">ascelstack deploy --layers build,grow,run</text>
      <rect class="cur" x="452" y="325" width="9" height="17" fill="#94BCE3"/>
    </g>
    <text class="f4 mono" x="72" y="390" font-size="13" fill="#94BCE3" fill-opacity="0.7">232 services · 13 disciplines · ascelstack.com</text>
  </g>

  <!-- 3D isometric stack -->
  <ellipse class="glow" cx="900" cy="360" rx="230" ry="70" fill="url(#glow)"/>
  <ellipse class="orbit" cx="900" cy="250" rx="230" ry="80" fill="none" stroke="#94BCE3" stroke-opacity="0.45" stroke-width="1.5"/>
  <ellipse class="orbit2" cx="900" cy="250" rx="270" ry="105" fill="none" stroke="#5980A6" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- Bottom layer: BUILD -->
  <g class="l1">
    <polygon points="750,300 900,386 900,416 750,330" fill="#22384D"/>
    <polygon points="900,386 1050,300 1050,330 900,416" fill="#2C4862"/>
    <polygon points="900,214 1050,300 900,386 750,300" fill="url(#topC)" stroke="#94BCE3" stroke-opacity="0.5"/>
  </g>
  <!-- Middle layer: GROW -->
  <g class="l2">
    <polygon points="770,232 900,307 900,333 770,258" fill="#3B5C7C"/>
    <polygon points="900,307 1030,232 1030,258 900,333" fill="#4A7096"/>
    <polygon points="900,157 1030,232 900,307 770,232" fill="url(#topB)" stroke="#C9DFF4" stroke-opacity="0.6"/>
  </g>
  <!-- Top layer: RUN -->
  <g class="l3">
    <polygon points="790,166 900,230 900,252 790,188" fill="#6F96BC"/>
    <polygon points="900,230 1010,166 1010,188 900,252" fill="#86ACD1"/>
    <polygon points="900,102 1010,166 900,230 790,166" fill="url(#topA)" stroke="#FFFFFF" stroke-opacity="0.7"/>
  </g>

  <!-- layer labels -->
  <g class="mono" font-size="13" font-weight="700" letter-spacing="3">
    <g class="l3"><line x1="1010" y1="177" x2="1050" y2="177" stroke="#C9DFF4" stroke-opacity="0.6"/><circle cx="1010" cy="177" r="3" fill="#C9DFF4"/><text x="1058" y="182" fill="#F2F2F3">RUN</text></g>
    <g class="l2"><line x1="1030" y1="245" x2="1070" y2="245" stroke="#94BCE3" stroke-opacity="0.6"/><circle cx="1030" cy="245" r="3" fill="#94BCE3"/><text x="1078" y="250" fill="#C9DFF4">GROW</text></g>
    <g class="l1"><line x1="1050" y1="315" x2="1090" y2="315" stroke="#5980A6" stroke-opacity="0.8"/><circle cx="1050" cy="315" r="3" fill="#5980A6"/><text x="1098" y="320" fill="#94BCE3">BUILD</text></g>
  </g>

  <!-- floating chips -->
  <g class="sans" font-size="12" font-weight="600">
    <g class="chip" style="animation-delay:.2s">
      <rect x="1052" y="70" width="104" height="28" rx="14" fill="#0E1823" fill-opacity="0.75" stroke="#94BCE3" stroke-opacity="0.5"/>
      <text x="1104" y="88" text-anchor="middle" fill="#C9DFF4">⚡ AI Agents</text>
    </g>
    <g class="chip" style="animation-delay:1.1s">
      <rect x="652" y="120" width="92" height="28" rx="14" fill="#0E1823" fill-opacity="0.75" stroke="#94BCE3" stroke-opacity="0.5"/>
      <text x="698" y="138" text-anchor="middle" fill="#C9DFF4">📈 SEO</text>
    </g>
    <g class="chip" style="animation-delay:2s">
      <rect x="1064" y="380" width="100" height="28" rx="14" fill="#0E1823" fill-opacity="0.75" stroke="#94BCE3" stroke-opacity="0.5"/>
      <text x="1114" y="398" text-anchor="middle" fill="#C9DFF4">🧾 GST · CRM</text>
    </g>
    <g class="chip" style="animation-delay:2.8s">
      <rect x="646" y="360" width="96" height="28" rx="14" fill="#0E1823" fill-opacity="0.75" stroke="#94BCE3" stroke-opacity="0.5"/>
      <text x="694" y="378" text-anchor="middle" fill="#C9DFF4">🛒 Stores</text>
    </g>
  </g>
</svg>
